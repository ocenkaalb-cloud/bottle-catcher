<html lang="ru">
<head>

<title>Ловец чекушек</title>

<style>
html,body{margin:0;height:100%;background:#08111f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f4ecd8}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden}
canvas{display:block}
#ui{position:absolute;left:0;top:0;width:360px;height:600px;transform-origin:0 0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,17,31,.78);text-align:center;padding:0 28px;box-sizing:border-box}
.hidden{display:none}
h1{margin:0;font-size:40px;line-height:1.05;color:#ffcf5c}
p{margin:0;font-size:17px;line-height:1.4;max-width:260px}
.big{font-size:56px;font-weight:800;color:#ffcf5c;line-height:1}
button{font:inherit;font-weight:700;font-size:19px;border:0;border-radius:16px;padding:14px 30px;background:#ffcf5c;color:#1a1405;cursor:pointer;min-width:220px}
button.alt{background:transparent;color:#f4ecd8;border:2px solid #5b7aa6;font-size:16px;padding:12px 20px}
button:active{transform:scale(.97)}
#snd{position:absolute;right:10px;top:42px;min-width:0;padding:6px 10px;font-size:18px;background:rgba(255,255,255,.08);color:#f4ecd8;border-radius:10px}
</style>

<div id="wrap"><div id="stage">

    </div>
  </div>
</div></div>

function gameOver(){
  state="over";
  if(score>best){best=score;try{localStorage.setItem("sc_best",best)}catch(e){}}
  $("fs").textContent=score;$("fb").textContent=best;
  $("over").classList.remove("hidden");
}
function burst(x,y,col){
  for(var i=0;i<9;i++){var a=Math.random()*6.28,s=40+Math.random()*90;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.45,c:col})}
}
function update(dt){
  if(keys.l)target-=430*dt;if(keys.r)target+=430*dt;
  target=Math.max(PW/2,Math.min(W-PW/2,target));
  px+=(target-px)*Math.min(1,dt*18);
  spawn-=dt;
  if(spawn<=0){
    spawn=Math.max(.32,.85-score*.006);
    items.push({x:22+Math.random()*(W-44),y:-20,rot:Math.random()*6,
      c:Math.random()<Math.min(.38,.14+score*.003),
      vy:(140+Math.min(score,90)*3)*(.85+Math.random()*.4)});
  }
  for(var i=items.length-1;i>=0;i--){
    var it=items[i];it.y+=it.vy*dt;it.rot+=dt*2;
    if(it.y>PY-22&&it.y<PY+PH&&Math.abs(it.x-px)<PW/2+4){
      items.splice(i,1);
      if(it.c){lives--;combo=0;burst(it.x,it.y,"#ff6b5b");beep(110,.3,"sawtooth",.09);
        if(lives<=0){gameOver();return}}
      else{combo++;score+=1+Math.floor(combo/10);burst(it.x,it.y,"#ffcf5c");beep(660+Math.min(combo,20)*25,.12)}
    }else if(it.y>H+30){items.splice(i,1);if(!it.c)combo=0}
  }
  for(var j=parts.length-1;j>=0;j--){var p=parts[j];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.l<=0)parts.splice(j,1)}
}

/* ---------- отрисовка ---------- */
function starPath(x,y,r,rot){
  ctx.beginPath();
  for(var k=0;k<10;k++){var a=rot+k*Math.PI/5-Math.PI/2,rr=k%2?r*.45:r;
    if(k)ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);else ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
  ctx.closePath();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0d2247");g.addColorStop(.7,"#0a1a33");g.addColorStop(1,"#17314f");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(var i=0;i<bg.length;i++){var s=bg[i];
    ctx.globalAlpha=.35+.35*Math.sin(t*1.5+s.p);ctx.fillStyle="#f4ecd8";
    ctx.fillRect(s.x,s.y,s.r,s.r)}
  ctx.globalAlpha=1;
  ctx.fillStyle="#102640";ctx.fillRect(0,H-36,W,36);

  for(i=0;i<items.length;i++){var it=items[i];
    if(it.c){
      if(imgQ.complete)ctx.drawImage(imgQ,it.x-26,it.y-26,52,51);
    }else if(imgB.complete){
      ctx.save();ctx.translate(it.x,it.y);ctx.rotate(Math.sin(it.rot)*.22);
      ctx.drawImage(imgB,-17,-32,34,64);ctx.restore();
    }
  }
  /* корзина */
  ctx.fillStyle="#7fe3c4";ctx.strokeStyle="#c9fbe9";ctx.lineWidth=3;ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(px-PW/2,PY);ctx.lineTo(px+PW/2,PY);
  ctx.lineTo(px+PW/2-12,PY+PH);ctx.lineTo(px-PW/2+12,PY+PH);ctx.closePath();
  ctx.fill();ctx.stroke();

  for(i=0;i<parts.length;i++){var q=parts[i];ctx.globalAlpha=Math.max(0,q.l/.45);ctx.fillStyle=q.c;ctx.fillRect(q.x-2,q.y-2,4,4)}
  ctx.globalAlpha=1;

  if(state==="play"){
    ctx.fillStyle="#f4ecd8";ctx.textBaseline="top";
    ctx.font="800 26px system-ui,sans-serif";ctx.textAlign="left";ctx.fillText(score,14,12);
    ctx.font="600 13px system-ui,sans-serif";ctx.fillStyle="#9fb4d3";
    ctx.fillText((lang==="ru"?"Рекорд ":"Best ")+best,14,44);
    if(combo>=5){ctx.fillStyle="#7fe3c4";ctx.fillText("x"+(1+Math.floor(combo/10))+"  ·  "+combo,14,62)}
    ctx.textAlign="right";ctx.font="22px system-ui,sans-serif";ctx.fillStyle="#ff6b5b";
    var h="";for(var l=0;l<lives;l++)h+="♥ ";ctx.fillText(h,W-12,12);
  }
}

var last=0;
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;
  if(state==="play"&&!adPause&&!hidden)update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ---------- ввод ---------- */
function setX(cx){var r=cv.getBoundingClientRect();target=(cx-r.left)/S}
window.addEventListener("pointermove",function(e){if(state==="play")setX(e.clientX)});
window.addEventListener("pointerdown",function(e){if(state==="play")setX(e.clientX)});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"||e.key==="a")keys.l=1;
  if(e.key==="ArrowRight"||e.key==="d")keys.r=1;
});
window.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft"||e.key==="a")keys.l=0;
  if(e.key==="ArrowRight"||e.key==="d")keys.r=0;
});
document.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("visibilitychange",function(){hidden=document.hidden});

$("play").onclick=start;
$("again").onclick=start;
$("snd").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊"};

/* ---------- размер ---------- */
function resize(){
  S=Math.min(innerWidth/W,innerHeight/H);
  var d=Math.min(window.devicePixelRatio||1,2);
  stage.style.width=W*S+"px";stage.style.height=H*S+"px";
  cv.style.width=W*S+"px";cv.style.height=H*S+"px";
  cv.width=Math.round(W*S*d);cv.height=Math.round(H*S*d);
  ctx.setTransform(S*d,0,0,S*d,0,0);
  ui.style.transform="scale("+S+")";
}
window.addEventListener("resize",resize);
resize();applyLang();requestAnimationFrame(loop);
})();
</script>
